<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="doc.title">SEMSA — Plataforma de Monitoreo Integral de Salud Espacial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" />
    <!-- __BUILD__ se reemplaza en cada despliegue: fuerza copias nuevas en Cloudflare y en el navegador -->
    <link rel="stylesheet" href="/src/styles/main.css?v=__BUILD__" />
    <link rel="stylesheet" href="/src/console/console.css?v=__BUILD__" />
    <!-- Hojas de las vistas declaradas aquí (con versión) para que las vistas no las inyecten sin versión -->
    <link rel="stylesheet" id="av-measure-css" href="/src/console/views/measure.css?v=__BUILD__" />
    <link rel="stylesheet" data-av-cm-css href="/src/console/views/countermeasures.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-al-css" href="/src/console/views/alerts.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-rec-css" href="/src/console/views/recommendations.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-log-css" href="/src/console/views/logbook.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-logfu-css" href="/src/console/views/logbook-followup.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-lt-css" href="/src/console/views/logbook-trends.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-mx-css" href="/src/console/views/more.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-env-css" href="/src/console/views/environments.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-wb-css" href="/src/console/views/wellbeing.css?v=__BUILD__" />
    <link rel="stylesheet" id="av-br-css" href="/src/console/views/breathing.css?v=__BUILD__" />
    <!-- Mapa de módulos: las importaciones relativas entre módulos también llevan la versión -->
    <script type="importmap">
      {
        "imports": {
          "/src/app/app.js": "/src/app/app.js?v=__BUILD__",
          "/src/i18n/i18n.js": "/src/i18n/i18n.js?v=__BUILD__",
          "/src/i18n/backend.js": "/src/i18n/backend.js?v=__BUILD__",
          "/src/i18n/backend-en-seed.js": "/src/i18n/backend-en-seed.js?v=__BUILD__",
          "/src/i18n/backend-en-runtime.js": "/src/i18n/backend-en-runtime.js?v=__BUILD__",
          "/src/services/api.js": "/src/services/api.js?v=__BUILD__",
          "/src/console/console.js": "/src/console/console.js?v=__BUILD__",
          "/src/console/body-figure.js": "/src/console/body-figure.js?v=__BUILD__",
          "/src/console/alert-classes.js": "/src/console/alert-classes.js?v=__BUILD__",
          "/src/console/views/measure.js": "/src/console/views/measure.js?v=__BUILD__",
          "/src/console/views/countermeasures.js": "/src/console/views/countermeasures.js?v=__BUILD__",
          "/src/console/views/alerts.js": "/src/console/views/alerts.js?v=__BUILD__",
          "/src/console/views/recommendations.js": "/src/console/views/recommendations.js?v=__BUILD__",
          "/src/console/views/logbook.js": "/src/console/views/logbook.js?v=__BUILD__",
          "/src/console/views/logbook-followup.js": "/src/console/views/logbook-followup.js?v=__BUILD__",
          "/src/console/views/logbook-trends.js": "/src/console/views/logbook-trends.js?v=__BUILD__",
          "/src/console/views/more-common.js": "/src/console/views/more-common.js?v=__BUILD__",
          "/src/console/views/measure-questionnaire.js": "/src/console/views/measure-questionnaire.js?v=__BUILD__",
          "/src/console/views/cognitive.js": "/src/console/views/cognitive.js?v=__BUILD__",
          "/src/console/views/emotional.js": "/src/console/views/emotional.js?v=__BUILD__",
          "/src/console/views/crew.js": "/src/console/views/crew.js?v=__BUILD__",
          "/src/console/views/admin.js": "/src/console/views/admin.js?v=__BUILD__",
          "/src/console/views/settings.js": "/src/console/views/settings.js?v=__BUILD__",
          "/src/console/views/environments.js": "/src/console/views/environments.js?v=__BUILD__",
          "/src/console/views/wellbeing.js": "/src/console/views/wellbeing.js?v=__BUILD__",
          "/src/console/views/breathing.js": "/src/console/views/breathing.js?v=__BUILD__"
        }
      }
    </script>
  </head>
  <body data-theme="space-dark">
    <!-- APPLICATION SHELL (sin pantalla de acceso: app.js abre la sesión demo al arrancar; sin barra lateral: la navegación es solo por la barra de pestañas global) -->
    <div id="app-shell" class="app-shell">
      <div class="main-area">
        <!-- Encabezado global fijo: barra HERA (la inserta console.js al inicio) → barra de estado → barra de alarma C&W → pestañas -->
        <header id="av-chrome" class="av-console av-chrome" aria-label="Encabezado de la consola de salud" data-i18n-attr="aria-label:chrome.aria">
          <div id="av-chrome-status"></div>
          <div id="av-chrome-alarm"></div>
          <div class="av-navrow">
            <nav id="av-global-tabs" class="av-gtabs" aria-label="Navegación principal" data-i18n-attr="aria-label:nav.aria">
              <button type="button" class="av-tab" data-nav-section="mission-control" aria-current="page" data-i18n="tab.summary">Resumen</button>
              <button type="button" class="av-tab" data-nav-section="radiation" data-i18n="tab.radiation">Radiación</button>
              <button type="button" class="av-tab" data-nav-section="environments" data-i18n="tab.environments">Entornos</button>
              <button type="button" class="av-tab" data-nav-section="my-health-check" data-i18n="tab.measure">Registrar medición</button>
              <button type="button" class="av-tab" data-nav-section="daily-missions">
                <!-- la insignia (contramedidas pendientes hoy) la rellena syncCountermeasuresBadge en console.js -->
                <span data-i18n="tab.countermeasures">Contramedidas</span> <span class="av-tab-badge js-cm-badge hidden">0</span>
              </button>
              <button type="button" class="av-tab" data-nav-section="wellbeing-hub">
                <span data-i18n="tab.wellbeing">Bienestar</span> <span class="av-tab-badge js-emo-badge hidden" title="Cuestionarios pendientes" data-i18n-attr="title:badge.emo">0</span>
              </button>
              <button type="button" class="av-tab" data-nav-section="alerts-center">
                <span data-i18n="tab.alerts">Alertas</span> <span class="av-tab-badge js-alert-badge hidden" title="Alertas activas" data-i18n-attr="title:badge.alerts">0</span>
              </button>
              <button type="button" class="av-tab" data-nav-section="reports" data-i18n="tab.logbook">Bitácora</button>
              <button type="button" class="av-tab" data-nav-section="recommendations" data-i18n="tab.recommendations">Recomendaciones</button>
            </nav>
            <div class="av-navtools">
              <div class="av-more" id="av-more">
                <button type="button" class="av-tab av-more-btn" id="av-more-btn" aria-expanded="false" aria-controls="av-more-menu">
                  <span data-i18n="more.btn">Más</span> <span class="av-more-caret" aria-hidden="true">▾</span>
                </button>
                <ul id="av-more-menu" class="av-more-menu" aria-label="Más secciones" data-i18n-attr="aria-label:more.aria" hidden>
                  <!-- Explorador corporal y Analítica de misión ya están en el Resumen (mapa corporal y tendencia por indicador);
                       sus ids antiguos se redirigen en navigateToSection (app.js).
                       Bienestar psicológico, Evaluación cognitiva y Check-in emocional se abren desde la pestaña
                       "Bienestar" → Hoy (wellbeing.js); sus rutas siguen en app.js. -->
                  <!-- Supervisión: visibles según el rol (updateRoleNavigation en app.js) -->
                  <li><button type="button" class="av-more-item" data-nav-section="crew-monitoring" data-i18n="more.crew">Monitoreo de tripulación</button></li>
                  <li><button type="button" class="av-more-item" data-nav-section="administration" data-i18n="more.admin">Administración</button></li>
                  <li><button type="button" class="av-more-item" data-nav-section="settings-help" data-i18n="more.settings">Ajustes y ayuda</button></li>
                </ul>
              </div>
              <div id="topbar-crew-selector-wrap" class="av-crew hidden">
                <label for="topbar-crew-select" class="av-lbl" data-i18n="crew.label">Tripulante</label>
                <select id="topbar-crew-select" class="av-input"></select>
              </div>
              <div class="av-lang">
                <span class="av-lbl" id="av-lang-lbl" data-i18n="lang.label">Idioma</span>
                <div id="av-lang-select" class="av-lang-switch" role="radiogroup" aria-labelledby="av-lang-lbl" data-av-lang></div>
              </div>
              <button type="button" class="av-btn" id="btn-quick-theme" aria-pressed="false" title="Alternar alto contraste" data-i18n="btn.contrast" data-i18n-attr="title:btn.contrastTitle">Contraste</button>
            </div>
          </div>
        </header>

        <!-- Dynamic Section Container -->
        <main id="section-view-container" class="content-wrapper" aria-live="polite"></main>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="/src/app/app.js?v=__BUILD__"></script>
  </body>
</html>
