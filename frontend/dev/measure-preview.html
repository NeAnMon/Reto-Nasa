<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vista previa · Registrar medición</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/console/console.css" />
  <style>
    body { margin: 0; background: #0e1116; }
    #view { padding: 1.4rem 1.4rem 0; }
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #e6eaf0; color: #0e1116; padding: 10px 16px; font: 14px "IBM Plex Sans", sans-serif; display: none; max-width: calc(100% - 32px); }
  </style>
</head>
<body>
  <!-- Vista previa sin backend: carga solo la vista "Registrar medición" con el JSON de ejemplo. -->
  <div id="view"></div>
  <div id="toast" role="status"></div>
  <script type="module">
    import { renderMeasureView } from "/src/console/views/measure.js";
    const toast = document.getElementById("toast");
    let t;
    const helpers = {
      showToast(msg) { toast.textContent = msg; toast.style.display = "block"; clearTimeout(t); t = setTimeout(() => (toast.style.display = "none"), 2600); },
      navigateToSection(id) { helpers.showToast(`(vista previa) navegar a: ${id}`); },
    };
    const appState = { currentUser: { id: 2 }, selectedAstronautId: 2, selectedMissionId: 1 };
    renderMeasureView(document.getElementById("view"), appState, helpers);
  </script>
</body>
</html>
