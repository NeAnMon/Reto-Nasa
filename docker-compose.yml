version: "3.9"

services:
  semsa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semsa-app
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=sqlite:///./data/astrovital.db
    volumes:
      - astrovital_data:/app/data
    restart: unless-stopped

volumes:
  astrovital_data:

